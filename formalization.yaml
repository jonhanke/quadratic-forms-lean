    relationship: "builds-on"
    note: "Built on Mathlib v4.35.0 (quadratic forms, number fields, adic completions, Haar measure)."
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "independent"
    note: >-
      Tau Ceti formalizes Witt's theorems (extension, cancellation, decomposition), the Witt ring,
      orthogonal groups and lattices for fields in which 2 is invertible. Developed independently; this
      repository does not import it. The Witt theorems here also cover characteristic 2.

status:
  scope: >-
    Formalized (the 13 statements of Challenge.lean, proved in Solution.lean): Siegel's theorem for
    totally positive definite quadratic lattices over totally real number fields, in every rank and every
    genus (lattices of any Steinitz class), for every totally positive m in O_F: rank >= 4 with the
    unconditional infinite product of local densities, ranks 2 and 3 with the Euler product regularized by
    L_F(1, chi) (each with a basis-dependent and a basis-free character), rank 1 with Siegel's factor 1/2;
    tau(SO(Q)) = 2 and the Smith-Minkowski-Siegel mass formula for totally positive definite forms in
    n >= 4 variables with coefficients in O_F, for the genus of the free lattice O_F^n (lower ranks and
    general lattices are proved in the library but not stated in Challenge.lean); Hilbert reciprocity over
    every number field; Hasse-Minkowski over every number field for isotropy, for representation of a
    nonzero number, and for isometry (both directions); Hasse-Minkowski over Q in any number of variables.
    Not formalized: Siegel's theorem for indefinite forms, representations of forms by forms (only numbers
    by forms), and the Siegel-Weil formula beyond these cases. Over a general totally real field the
    natural-order (non-regularized) rank-2 and rank-3 statements are proved only conditionally on the
    hypothesis RegProd.NaturalOrderEulerOne; they are not among the Challenge statements.
  sorry_count: 0
  sorry_in_definitions: 0
  # No custom axioms; the standard axioms used (checked by scripts/check_axioms.lean and lake comparator):
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code orchestrating parallel agents, each in its own git worktree and branch, with Lean kernel
        builds (lake build) as the check and pull requests merged into the main branch; human direction
        throughout.
      cost:
        wall_time: "about one week (2026-10-13 to 2026-10-20), agents running around the clock"
        spend_usd: >-
          subscription-based (Claude Max plan, $200/month); API-equivalent value of the tokens about
          $1,200-1,800 (measured from local Claude Code logs)
        hardware: "local machine (MacBook) for builds; API for models"
      prompting_notes: >-
        Human-written roadmaps and goals per result; agents were given design documents and handoff notes
        from earlier sessions. The human chose the results, the conventions (e.g. classes under the full
        orthogonal group with weights 1/|O(L)|) and the proof routes (local routes such as the Weil index
        for Hilbert reciprocity; Weil's adelic route for Siegel's theorem).
  spend_usd: "subscription-based (Claude Max plan); API-equivalent value about $1,200-1,800"
  notes: >-
    Jonathan Hanke designed and directed the project; the Lean code was written almost entirely by
    Claude Opus 5.5, with a small share by Claude Sonnet 5.5. An orchestrating session split each result
    into work items, launched agents on separate branches, reviewed and merged their pull requests, and
    kept a decisions log. All proofs are checked by the Lean kernel; the headline statements were
    collected in Challenge.lean for human review.

fidelity:
  divergences: >-
    (1) Ranks 2 and 3 of Siegel's theorem are stated with the Euler product regularized by L_F(1, chi)
    (the product of local densities does not converge absolutely there); the natural-order versions are
    proved in the library only conditionally on RegProd.NaturalOrderEulerOne over a general totally real
    field. (2) Classes of lattices are isometry
    classes under the full orthogonal group O(L) (improper isometries included), each weighted by
    1/|O(L)|, rather than proper classes weighted by 1/|SO(L)|. (3) Siegel's factor 1/2 appears in ranks
    1 and 2 as in the classical statement; in rank 1 it is placed at every place. (4) The Tamagawa number
    and mass formula statements in Challenge.lean are for forms with coefficients in O_F on the free
    lattice O_F^n in n >= 4 variables; tauSO is defined as a Tamagawa volume times a double-coset mass and
    proved equal to the covolume for Weil's Tamagawa measure in the library. (5) Local densities are the
    classical counts beta_p = lim #{x mod p^k : Q(x) = m mod p^k} / Np^{k(n-1)}, and the mass formula uses
    Siegel's alpha_p = beta_p / 2 for the representation of Q by itself. (6) No term of the headline
    formulas relies on a Lean default value (tprod = 1 for a non-convergent product, finsum = 0 over an
    infinite set, Nat.card = 0 for an infinite type, a junk limit): each headline states as extra conjuncts
    that the genus has finitely many classes, that the automorphism groups and representation sets in the
    genus are finite, that the infinite products converge unconditionally, that L_F(1, chi) exists and is
    positive (ranks 2 and 3, where the corrected product inside the regularized product converges
    unconditionally), and, for tau(SO(Q)) = 2, that the SO double coset space is finite with finite
    stabilizers.
    (7) Quadratic forms in the local-global statements are coefficient-based forms sum_{i<=j} c_ij x_i x_j;
    nondegenerate means the Hessian has nonzero determinant. (8) Literature locators marked [unverified]
    have not been checked against the sources.

review:
  status: "self-assessed"
  reviewers:
    - "Jonathan Hanke (in progress)"
  notes: >-
    The headline statements in Challenge.lean are under review by Jonathan Hanke; no external review yet.
    Lean checks the proofs; lake comparator checks that Solution.lean proves exactly the Challenge.lean
    statements using only the standard axioms.

alignment:
  namespace: "QuadFormsKB"
  statements:
    - source: "Siegel 1935, Hauptsatz [unverified locator]; Weil 1965 (Siegel's formula), totally real fields, rank >= 4"
      lean: "QuadFormsKB.Headlines.siegel_totallyReal"
      module: "Challenge / Solution"
      status: "proved"
      note: "Totally positive definite lattices of rank >= 4 over a totally real field, every genus."
    - source: "Siegel 1935, Hauptsatz [unverified locator], rank 3"
      lean: "QuadFormsKB.Headlines.siegel_totallyReal_rank3"
      module: "Challenge / Solution"
      status: "proved"
      note: "Euler product regularized by L_F(1, chi_m); character defined via a chosen basis."
    - source: "Siegel 1935, Hauptsatz [unverified locator], rank 3"
      lean: "QuadFormsKB.Headlines.siegel_totallyReal_rank3'"
      module: "Challenge / Solution"
      status: "proved"
      note: "As above with a basis-free character."
    - source: "Siegel 1935, Hauptsatz [unverified locator], rank 2"
      lean: "QuadFormsKB.Headlines.siegel_totallyReal_rank2"
      module: "Challenge / Solution"
      status: "proved"
      note: "Factor 1/2; Euler product regularized by L_F(1, chi_Q)^{-1}; character via a chosen basis."
    - source: "Siegel 1935, Hauptsatz [unverified locator], rank 2"
      lean: "QuadFormsKB.Headlines.siegel_totallyReal_rank2'"
      module: "Challenge / Solution"
      status: "proved"
      note: "As above with a basis-free character."
    - source: "Siegel 1935, Hauptsatz [unverified locator], rank 1"
      lean: "QuadFormsKB.Headlines.siegel_totallyReal_rank1"
      module: "Challenge / Solution"
      status: "proved"
      note: "Factor 1/2 at every place."
    - source: "Weil 1982, Adeles and Algebraic Groups, tau(SO) = 2 [unverified locator]"
      lean: "QuadFormsKB.Headlines.tamagawa_two_totallyReal"
      module: "Challenge / Solution"
      status: "proved"
      note: "Totally positive definite forms over O_F in n >= 4 variables, F totally real."
    - source: "Smith-Minkowski-Siegel mass formula; Siegel 1935 [unverified locator]"
      lean: "QuadFormsKB.Headlines.massFormula_totallyReal"
      module: "Challenge / Solution"
      status: "proved"
      note: "Genus of the free lattice O_F^n, n >= 4."
    - source: "O'Meara 1963, 71:18 (Hilbert reciprocity) [unverified locator]"
      lean: "QuadFormsKB.Headlines.hilbertReciprocity_numberField"
      module: "Challenge / Solution"
      status: "proved"
      note: "Every number field; finitely many and an even number of places with (a, b)_v = -1."
    - source: "O'Meara 1963, 66:1 (Hasse-Minkowski) [unverified locator]"
      lean: "QuadFormsKB.Headlines.hasseMinkowski_numberField"
