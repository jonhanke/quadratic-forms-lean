# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "QuadFormsKB: quadratic forms over number fields"
  description: >-
    A Lean 4 + Mathlib formalization of the arithmetic theory of quadratic forms over number fields.
    Principal results: Siegel's theorem (the genus average of representation numbers equals a product of
    local densities) for totally positive definite quadratic lattices of every rank, in every genus, over
    every totally real number field; the Tamagawa number tau(SO(Q)) = 2 and the Smith-Minkowski-Siegel mass
    formula over totally real fields; Hilbert reciprocity over every number field, proved locally via the
    Weil index; and the Hasse-Minkowski local-global principle over every number field (isotropy,
    representation, isometry) and over the rationals. Further results include Witt's theorems over every
    field (characteristic 2 included), the classification of forms over p-adic fields, Jordan
    decompositions and local densities at every prime (dyadic included), finiteness of class numbers,
    strong approximation for spin groups, Kneser neighbours, the Hasse norm theorem for quadratic
    extensions, and Dirichlet's class number formula.
  authors:
    - "Jonathan Hanke"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jonathan Hanke"

classification:
  arxiv: ["math.NT"]
  # 11E12 quadratic forms over global rings and fields; 11E08 quadratic forms over local rings and fields;
  # 11E41 class numbers of quadratic and Hermitian forms; 11E45 analytic theory (Epstein zeta functions;
  # relations with automorphic forms and functions), the home of Siegel's formula; 11E57 classical groups;
  # 03B35 mechanization of proofs and logical operations.
  msc2020: ["11E12", "11E08", "11E41", "11E45", "11E57", "03B35"]

