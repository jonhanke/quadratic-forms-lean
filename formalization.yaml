      repository does not import it. The Witt theorems here also cover characteristic 2.

status:
  scope: >-
    Formalized (the 35 statements of Challenge.lean, proved in Solution.lean). Release 0.1.0 (13 statements):
    Siegel's theorem for totally positive definite quadratic lattices over totally real number fields, in every
    rank and every genus (lattices of any Steinitz class), for every totally positive m in O_F: rank >= 4 with the
    unconditional infinite product of local densities, ranks 2 and 3 with the Euler product regularized by
    L_F(1, chi) (each with a basis-dependent and a basis-free character), rank 1 with Siegel's factor 1/2;
    tau(SO(Q)) = 2 and the Smith-Minkowski-Siegel mass formula for totally positive definite forms in n >= 4
    variables with coefficients in O_F, for the genus of the free lattice O_F^n; Hilbert reciprocity over every
    number field; Hasse-Minkowski over every number field for isotropy, for representation of a nonzero number,
    and for isometry (both directions); Hasse-Minkowski over Q in any number of variables. Release 0.2.0 (21
    statements): the Tamagawa number of SO(V) over every number field for every nondegenerate quadratic form or
    space (tau = 2 for n >= 3 with convergence factors 1; tau = 2 for anisotropic binary spaces with the convergence
    factors L_v(1, chi_E); tau = 1 for isotropic binary spaces, measured on the norm-one subgroup; tau = 1 for n = 1);
    Siegel's formula in measure form for indefinite forms over every number field: numbers by forms in N >= 4
    variables, forms by forms with stabilizer rank >= 3, stabilizer rank 2 (anisotropic, regularized by L_F(1, chi);
    isotropic, Siegel's excluded case, regularized by the residue of zeta_F), ternary forms representing numbers in
    both cases, corank 1 (including anisotropic binary forms representing numbers) and corank 0; Siegel's formula
    for totally positive definite forms representing totally positive definite forms over totally real fields
    (N >= 3, N - r != 2); Gauss's three-squares theorem, Jacobi's two-squares theorem, Siegel's formula for
    x^2 + y^2 with explicit constants, and Dirichlet's theorem for x^2 - 2y^2. Release 0.2.1 (1 new statement, 9
    extended): the number of representations of m != 0 by xy over Q modulo +-1 is the number of divisors of |m|,
    with one proper class in the genus of Z^2; the nine indefinite Siegel statements of 0.2.0 now also state that
    the genus has finitely many proper classes. Not formalized: the Siegel-Weil
    formula beyond these cases, and Tamagawa numbers of groups other than SO(V). Over a general totally real field
    the natural-order (non-regularized) rank-2 and rank-3 statements are proved only conditionally on the
    hypothesis RegProd.NaturalOrderEulerOne; they are not among the Challenge statements. An input of the library,
    AdelicSphereEulerGaussInputs, is false; the three theorems assuming it are vacuous and are not headlines
    (docs/results/errata.md).
  sorry_count: 0
  sorry_in_definitions: 0
  # No custom axioms; the standard axioms used (checked by scripts/check_axioms.lean and lake comparator):
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code orchestrating parallel agents, each in its own git worktree and branch, with Lean kernel
        builds (lake build) as the check and pull requests merged into the main branch; human direction
        throughout.
      cost:
        wall_time: >-
          release 0.1.0: about one week (2026-10-13 to 2026-10-20), agents running around the clock; up to
          release 0.2.0: the source repository was created on 2026-10-14, and its main branch has about 3,260
          commits as of 2026-10-27
        spend_usd: >-
          subscription-based (Claude Max plan, $200/month); API-equivalent value of the tokens at list prices
          about $1,200-1,800 for release 0.1.0, and about $3,090 for the source repository up to release 0.2.0
          (35,720 requests, mostly Claude Opus 5.5, with Claude Sonnet 5.5 subagents; overhead included;
          measured from local Claude Code logs on 2026-10-27)
        hardware: "local machine (MacBook) for builds; API for models"
      prompting_notes: >-
        Human-written roadmaps and goals per result; agents were given design documents and handoff notes
        from earlier sessions. The human chose the results, the conventions (e.g. classes under the full
        orthogonal group with weights 1/|O(L)|) and the proof routes (local routes such as the Weil index
        for Hilbert reciprocity; Weil's adelic route for Siegel's theorem).
  spend_usd: >-
    subscription-based (Claude Max plan); API-equivalent value about $1,200-1,800 for release 0.1.0 and about
    $3,090 for the source repository up to release 0.2.0
  notes: >-
    Jonathan Hanke designed and directed the project; the Lean code was written almost entirely by
    Claude Opus 5.5, with a small share by Claude Sonnet 5.5. An orchestrating session split each result
    into work items, launched agents on separate branches, reviewed and merged their pull requests, and
    kept a decisions log. All proofs are checked by the Lean kernel; the headline statements were
    collected in Challenge.lean for human review.

fidelity:
  divergences: >-
    (1) Ranks 2 and 3 of Siegel's theorem are stated with the Euler product regularized by L_F(1, chi)
    (the product of local densities does not converge absolutely there); the natural-order versions are
    proved in the library only conditionally on RegProd.NaturalOrderEulerOne over a general totally real
    field. (2) Classes of lattices are isometry
    classes under the full orthogonal group O(L) (improper isometries included), each weighted by
    1/|O(L)|, rather than proper classes weighted by 1/|SO(L)|. (3) Siegel's factor 1/2 appears in ranks
    1 and 2 as in the classical statement; in rank 1 it is placed at every place. (4) The Tamagawa number
    and mass formula statements in Challenge.lean are for forms with coefficients in O_F on the free
    lattice O_F^n in n >= 4 variables; tauSO is defined as a Tamagawa volume times a double-coset mass and
    proved equal to the covolume for Weil's Tamagawa measure in the library. (5) Local densities are the
    classical counts beta_p = lim #{x mod p^k : Q(x) = m mod p^k} / Np^{k(n-1)}, and the mass formula uses
    Siegel's alpha_p = beta_p / 2 for the representation of Q by itself. (6) No term of the headline
    formulas relies on a Lean default value (tprod = 1 for a non-convergent product, finsum = 0 over an
    infinite set, Nat.card = 0 for an infinite type, a junk limit): each headline states as extra conjuncts
    that the genus has finitely many classes, that the automorphism groups and representation sets in the
    genus are finite, that the infinite products converge unconditionally, that L_F(1, chi) exists and is
    positive (ranks 2 and 3, where the corrected product inside the regularized product converges
    unconditionally), and, for tau(SO(Q)) = 2, that the SO double coset space is finite with finite
    stabilizers. For the 0.2.x statements the same is done (convergence of the products in the Tamagawa measures
    and of the products of local densities, existence and positivity of L_F(1, chi), 0 < sum of unit volumes <
    infinity, and, since 0.2.1, finiteness of the proper classes of the genus in the indefinite Siegel formulas,
    whose sums over these classes are sums in [0, infinity]).
    (7) Quadratic forms in the local-global statements are coefficient-based forms sum_{i<=j} c_ij x_i x_j;
    nondegenerate means the Hessian has nonzero determinant. (8) Literature locators marked [unverified]
    have not been checked against the sources.

review:
  status: "partially author-reviewed: the 13 release-0.1.0 headline statements in Challenge.lean and the definitions they use are reviewed; the 21 headline statements added in release 0.2.0 (nine of them extended in 0.2.1) and the one added in 0.2.1 are not yet reviewed (planned for 0.2.2)"
  reviewers:
    - "Jonathan Hanke"
  notes: >-
    Jonathan Hanke reviewed the release-0.1.0 headline statements in Challenge.lean and every definition they use
    (October 2026). The 21 headline statements added in release 0.2.0 (nine of them extended in release 0.2.1), the
    one added in release 0.2.1, and the definitions they use, have not yet been reviewed by a human; that review is planned for release 0.2.2. The rest of the library has not been reviewed by a human, and there has been no
    external review yet. Lean checks the proofs; lake comparator checks that Solution.lean proves exactly
    the Challenge.lean statements using only the standard axioms.

